<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FarmWise AI — Find urea and fertilizer stores near you.">
    <title>Find Fertilizers | FarmWise AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-900: #0d2b1e;
            --green-800: #173f35;
            --green-600: #176b45;
            --green-500: #2d8653;
            --green-400: #4cad73;
            --green-300: #72c993;
            --white: #ffffff;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--green-900);
            color: var(--white);
            min-height: 100vh;
        }
        header {
            padding: 1.25rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(23,63,53,0.5);
            backdrop-filter: blur(12px);
        }
        .brand { text-decoration: none; color: var(--white); font-family: 'Manrope',sans-serif; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .brand-mark { width: 32px; height: 32px; background: linear-gradient(135deg, var(--green-500), var(--green-300)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem; }
        .btn-back { padding: 0.5rem 1rem; border-radius: 999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
        .btn-back:hover { background: rgba(255,255,255,0.14); color: var(--white); }
        main { padding: 3rem 2rem; max-width: 900px; margin: 0 auto; }
        .page-title { font-family: 'Manrope',sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
        .page-subtitle { color: rgba(255,255,255,0.55); margin-bottom: 2rem; }
        .search-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .search-row {
            display: flex;
            gap: 0.75rem;
        }
        .search-input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 0.5rem;
            color: var(--white);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.3); }
        .search-input:focus { border-color: rgba(45,134,83,0.5); }
        .btn-search {
            padding: 0.75rem 1.5rem;
            background: var(--green-500);
            color: var(--white);
            border: none;
            border-radius: 0.5rem;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-search:hover { background: var(--green-400); }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.65); margin-bottom: 0.4rem; }
        .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        .field-group { display: flex; flex-direction: column; }
        .results-container { margin-top: 1rem; }
        .result-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0.75rem;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .result-item:hover { background: rgba(255,255,255,0.07); border-color: rgba(45,134,83,0.3); }
        .result-info h4 { font-family: 'Manrope',sans-serif; font-weight: 700; margin-bottom: 0.25rem; }
        .result-info p { color: rgba(255,255,255,0.5); font-size: 0.85rem; }
        .stock-badge {
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .in-stock { background: rgba(45,134,83,0.2); color: var(--green-300); border: 1px solid rgba(45,134,83,0.3); }
        .low-stock { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: rgba(255,255,255,0.4);
        }
        .empty-state .icon { font-size: 3rem; display: block; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <header>
        <a href="farmer.html" class="brand">
            <span class="brand-mark">F</span>
            FarmWise <strong>AI</strong>
        </a>
        <a href="farmer.html" class="btn-back">← Back to Dashboard</a>
    </header>

    <main>
        <h1 class="page-title">🔍 Find Fertilizers Near You</h1>
        <p class="page-subtitle">Search for urea, DAP, seeds, or other agricultural inputs available from local dealers.</p>

        <div class="search-box">
            <label for="product-search">What are you looking for?</label>
            <div class="search-row">
                <input type="search" id="product-search" class="search-input" placeholder="e.g. urea, DAP, NPK, seeds...">
                <button class="btn-search" onclick="searchProducts()">Search</button>
            </div>
            <div class="fields-row">
                <div class="field-group">
                    <label for="village-filter">Village</label>
                    <input type="text" id="village-filter" class="search-input" placeholder="Enter village">
                </div>
                <div class="field-group">
                    <label for="district-filter">District</label>
                    <input type="text" id="district-filter" class="search-input" placeholder="Enter district">
                </div>
            </div>
        </div>

        <div class="results-container" id="results-container">
            <div class="empty-state">
                <span class="icon">🌱</span>
                <p>Search above to find fertilizers available near your village.</p>
            </div>
        </div>
    </main>

    <script>
        // Sample demo data to show when backend is unavailable
        const demoProducts = [
            { name: "Urea (45% N)", dealer: "Sri Lakshmi Agro Store", location: "Guntur, Andhra Pradesh", stock: "2,400 kg", status: "in-stock" },
            { name: "DAP Fertilizer", dealer: "Raju Farm Supplies", location: "Krishna District, AP", stock: "850 kg", status: "in-stock" },
            { name: "NPK Complex (17:17:17)", dealer: "Anjaneya Traders", location: "Nellore, Andhra Pradesh", stock: "120 kg", status: "low-stock" },
            { name: "Urea (Neem Coated)", dealer: "Green Field Agro", location: "Kurnool, Andhra Pradesh", stock: "3,100 kg", status: "in-stock" },
            { name: "SSP (Single Super Phosphate)", dealer: "Ravi Fertilizers", location: "Prakasam District, AP", stock: "950 kg", status: "in-stock" },
        ];

        function searchProducts() {
            const query = document.getElementById('product-search').value.trim().toLowerCase();
            const container = document.getElementById('results-container');

            if (!query) {
                container.innerHTML = '<div class="empty-state"><span class="icon">🌱</span><p>Please enter a product name to search.</p></div>';
                return;
            }

            const filtered = demoProducts.filter(p =>
                p.name.toLowerCase().includes(query) ||
                p.dealer.toLowerCase().includes(query) ||
                p.location.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><span class="icon">😕</span><p>No products found. Try a different search term.</p></div>';
                return;
            }

            container.innerHTML = filtered.map(p => `
                <div class="result-item">
                    <div class="result-info">
                        <h4>${p.name}</h4>
                        <p>🏪 ${p.dealer} &nbsp;·&nbsp; 📍 ${p.location}</p>
                        <p style="margin-top:0.3rem">Stock: <strong>${p.stock}</strong></p>
                    </div>
                    <span class="stock-badge ${p.status === 'in-stock' ? 'in-stock' : 'low-stock'}">
                        ${p.status === 'in-stock' ? '✓ In Stock' : '⚠ Low Stock'}
                    </span>
                </div>
            `).join('');
        }

        document.getElementById('product-search').addEventListener('keydown', e => {
            if (e.key === 'Enter') searchProducts();
        });
    </script>
</body>
</html>
